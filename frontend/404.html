<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — AI Intelligence Layer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      gap: 12px;
      text-align: center;
      padding: 2rem;
    }
    .code { font-size: 13px; color: #4f8ef7; font-weight: 600; letter-spacing: 0.08em; }
    h1 { font-size: 28px; font-weight: 500; }
    p { color: rgba(255,255,255,0.35); font-size: 15px; }
    a {
      margin-top: 8px;
      color: #4f8ef7;
      font-size: 14px;
      text-decoration: none;
      border-bottom: 1px solid rgba(79,142,247,0.4);
      padding-bottom: 2px;
    }
    a:hover { border-bottom-color: #4f8ef7; }
  </style>
</head>
<body>
  <span class="code">404</span>
  <h1>Page not found</h1>
  <p>This page does not exist or has been moved.</p>
  <a href="/">Back to home</a>
</body>
</html>
